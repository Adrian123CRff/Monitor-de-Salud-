spring:
  application:
    name: monitor-salud-oracle
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Apunta al datasource @Primary (historico, ver DataSourceConfig).
    # La instancia Oracle monitoreada NUNCA se migra.
  task:
    scheduling:
      pool:
        # Spring Boot arranca @EnableScheduling (SchedulingConfig) con UN
        # hilo por defecto. Con JdbcClienteConTimeout ya no debería quedar
        # bloqueado para siempre, pero un segundo hilo es barato y evita que
        # el ciclo de muestreo comparta el único hilo del scheduler con
        # cualquier otra tarea @Scheduled que se agregue después.
        size: 2

monitor:
  # Instancia fija (ADR 0001: una sola instancia Oracle en Docker, no
  # multi-tenant) -- corresponde a la fila 'id' en monitor_instancia.
  # No hay RepositorioInstancias todavía; se amplía si el proyecto crece
  # a varias instancias.
  instancia-id: 1
  datasource:
    # jdbc-url, no url: DataSourceConfig bindea @ConfigurationProperties
    # directamente sobre el HikariDataSource ya construido (sin pasar por la
    # traducción de nombres que hace DataSourceBuilder cuando arma él mismo
    # las propiedades) -- el setter real es setJdbcUrl(), "url" se ignora en
    # silencio y el pool arranca sin URL. Verificado en vivo: sin este
    # nombre, el arranque de la app "funciona" pero el primer intento real
    # de usar el DataSource revienta con "dataSource or dataSourceClassName
    # or jdbcUrl is required".
    # Las URL también son overridables: por defecto apuntan a localhost (para
    # cuando monitor-api corre en el host y Oracle/Postgres corren en Docker
    # con los puertos publicados, el flujo de desarrollo de todo este
    # proyecto). Dentro de docker-compose, monitor-api es OTRO contenedor:
    # "localhost" ahí sería el propio contenedor, no el de al lado -- ver
    # el override a MONITOR_DB_URL/HISTORICO_DB_URL con los nombres de
    # servicio de Compose en docker-compose.yml.
    # Dos conexiones a la MISMA instancia Oracle, a propósito -- ver el
    # comentario largo en DataSourceConfig. Resumen: SGA/PGA/límites de
    # recursos son datos de la instancia completa y solo se ven bien desde
    # CDB$ROOT (verificado en vivo: "aggregate PGA target parameter" da
    # 536870912 desde FREE y 0 desde FREEPDB1); los tablespaces/datafiles
    # son por contenedor y solo se ven bien desde el PDB (verificado en
    # vivo: DBA_TABLESPACE_USAGE_METRICS devuelve filas distintas y sin
    # error en ambos, la trampa exacta que describe la skill
    # oracle-vistas-dinamicas/references/cdb-pdb.md).
    monitoreada:
      jdbc-url: ${MONITOR_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREE}
      username: c##monitor
      password: ${MONITOR_DB_PASSWORD:MonitorPass123}
    monitoreada-pdb:
      jdbc-url: ${MONITOR_DB_PDB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
      username: c##monitor
      password: ${MONITOR_DB_PASSWORD:MonitorPass123}
    historico:
      jdbc-url: ${HISTORICO_DB_URL:jdbc:postgresql://localhost:5432/monitor_historico}
      username: ${HISTORICO_DB_USER:monitor}
      password: ${HISTORICO_DB_PASSWORD:HistoricoPass123}
  muestreo:
    # Un solo intervalo, no uno por componente: MuestrearInstanciaServicio.ejecutar()
    # recolecta procesos+memoria+archivos juntos en un solo ciclo (así el ISBD
    # combina IP/IM/IA del MISMO instante, en vez de mezclar datos de edades
    # distintas). Efecto secundario aceptado: DBA_TABLESPACE_USAGE_METRICS
    # (pensada para consultarse cada ~10 min) se consulta más seguido -- a la
    # escala de este proyecto (Oracle Free en Docker) no es un problema real.
    intervalo: PT60S      # ISO-8601 Duration
  pesos:
    # ADR 0003 / documento de diseño, sección 17: propuesta inicial, no calibrada.
    procesos: 0.30
    memoria:  0.35
    archivos: 0.35
  agregacion:
    # ADR 0003: media aritmética ponderada, no geométrica.
    metodo: ARITMETICA
    veto:
      habilitado: true
      umbral-componente: 40   # franja CRITICO de la escala (Estado.java). Pendiente P3: calibrar con datos reales.
  planificador:
    habilitado: true
